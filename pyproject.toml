[project]
name = "exopt"
version = "0.1.0"
description = "Bayesian optimization of exoskeleton torque profiles, with the subject in the loop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bofus",
    "einops>=0.8.2",
    "jax>=0.10.2",
    "jaxtyping>=0.3.11",
    "numpy>=2.3",
    "pyzmq>=27.1.0",
]

[project.scripts]
bo-loop = "exopt.optimization_loop:main"
start = "exopt.dashboard:main"
exo-review = "exopt.review:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
controller = [
    "pycandlemab==1.6.0 ; sys_platform == 'linux'",
]
optimizer = [
    "dash>=4.4.1",
    "paramiko>=5.1.0",
    "plotly>=6.9.0",
]

[tool.uv.sources]
bofus = { git = "https://github.com/davidesartor/BOFUS", rev = "abf6e1cf898cf80a6974c83a6714432ce4df2850" }
