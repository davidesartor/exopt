[project]
name = "exopt"
version = "0.1.0"
description = "Bayesian optimization of exoskeleton torque profiles, with the subject in the loop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.10.2",
    "jaxtyping>=0.3.11",
    "jaxvlse>=0.1.3",
    "numpy>=2.3",
    "plotly>=6.9.0",
    "pyzmq>=27.1.0",
]

[project.scripts]
bo-loop = "exopt.bo_loop:main"
start = "exopt.dashboard:main"
exo-review = "exopt.dashboard:review_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "dash>=4.4.1",
    "paramiko>=5.1.0",
]
