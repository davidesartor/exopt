[project]
name = "exopt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jaxtyping>=0.3.11",
    "jaxvlse>=0.1.3",
    "numpy>=2.5.1",
    "pyzmq>=27.1.0",
    "tqdm>=4.70.0",
]

[project.scripts]
mock-stream = "exopt.mock_controller:main"
bo-loop = "exopt.bo_loop:main"
exo-view = "exopt.animate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "plotly>=6.9.0",
]
