[project]
name = "exopt"
version = "0.1.0"
description = "Bayesian optimization of exoskeleton torque profiles, with the subject in the loop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bofus",
    "einops>=0.8.2",
    "jax>=0.10.2",
    "jaxtyping>=0.3.11",
    "numpy>=2.3",
    "pyzmq>=27.1.0",
]

[project.scripts]
bo-loop = "exopt.bo_loop:main"
exo-dashboard = "exopt.dashboard:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "dash>=4.4.1",
    "plotly>=6.9.0",
]

[tool.uv.sources]
bofus = { git = "https://github.com/davidesartor/BOFUS", rev = "adapt_rho" }
