[project]
name = "exopt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jaxtyping>=0.3.11",
    "jaxvlse>=0.1.3",
    "numpy>=2.3",
    "pyzmq>=27.1.0",
]

[project.scripts]
exo-controller = "exopt.controller:main"
bo-loop = "exopt.bo_loop:main"
exo-dashboard = "exopt.dashboard:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "dash>=4.4.1",
    "plotly>=6.9.0",
]
